<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Driftwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../style.css">
</head>
<body class="decoy-page" style="--bx:75%;--by:75%">
<div id="content">
<div class="scene" style="--jc:center;--ai:center">
<div class="note-wrap" style="--tilt:2.6deg">
  <main class="note">
  <div class="eyebrow">Brandon&rsquo;s Treasure Hunt</div>
  <h1>Driftwood</h1>
  <p class="flavor">Ye found&hellip; absolutely nothin'. This QR code be driftwood. Sail on.</p>
  </main>
</div>
</div>
</div>
<div class="scene" id="sealed-scene" hidden>
  <div class="note-wrap">
    <div class="pin"><span>&#128274;</span></div>
    <main class="note">
      <div class="eyebrow">Brandon&rsquo;s Treasure Hunt</div>
      <h1>This Scroll Be Sealed</h1>
      <p class="riddle">The wax holds fast. Only the true mark breaks it &mdash; go scan a proper QR code, ye sneaky dog.</p>
    </main>
  </div>
</div>
<script>
(function () {
  if (new URLSearchParams(location.search).get('k') !== '034bd1cf49a8') {
    document.getElementById('content').hidden = true;
    document.getElementById('sealed-scene').hidden = false;
  }
})();
</script>
</body>
</html>
