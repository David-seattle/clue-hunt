<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype E — Pinned Note</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'IM Fell English', Georgia, serif;
  min-height: 100vh;
  background: url("map-illustration.jpg") center / cover no-repeat #d9b978;
  color: #3a2a12;
  overflow: hidden;
}

/* The red thread and the X it leads to, drawn over the map. */
.thread {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.scene {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem 1rem 30vh;
}

/* A small scrap of paper pinned to the map. */
.note {
  position: relative;
  width: min(21rem, 92vw);
  padding: 1.9rem 1.6rem 1.6rem;
  text-align: center;
  background:
    radial-gradient(circle at 80% 10%, rgba(122, 82, 32, 0.14), transparent 18%),
    linear-gradient(174deg, #f7edd2 0%, #efdfb4 70%, #e3cf9c 100%);
  transform: rotate(-2.4deg);
  clip-path: polygon(
    2% 4%, 12% 1%, 28% 3%, 45% 0.6%, 62% 2.8%, 80% 0.8%, 97% 3%, 99.4% 14%,
    98% 32%, 99.6% 52%, 97.8% 72%, 99.2% 88%, 96% 97%, 80% 99%, 62% 97.2%,
    44% 99.4%, 26% 97.4%, 10% 99%, 1.4% 95%, 2.6% 78%, 0.8% 58%, 2.4% 38%, 0.6% 18%);
  box-shadow: 0 1rem 2rem rgba(45, 24, 5, 0.45);
}

/* wax seal acting as the pin */
.pin {
  position: absolute;
  top: -1.2rem;
  left: 50%;
  transform: translateX(-50%) rotate(5deg);
  width: 2.6rem;
  height: 2.6rem;
  border-radius: 48% 52% 50% 50% / 52% 48% 52% 48%;
  background: radial-gradient(circle at 35% 30%, #b04530, #8c2b1a 60%, #571a0e);
  box-shadow: 0 0.25rem 0.6rem rgba(0, 0, 0, 0.45), inset 0 0 0 3px rgba(255, 235, 210, 0.14);
  display: flex;
  align-items: center;
  justify-content: center;
}

.pin span { font-family: 'Pirata One', cursive; font-size: 1rem; color: #f3e0c8; }

.eyebrow {
  font-size: 0.68rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #8a6420;
  margin-bottom: 0.6rem;
}

h1 {
  font-family: 'Pirata One', cursive;
  font-weight: 400;
  font-size: 1.75rem;
  line-height: 1.05;
  color: #7c2413;
  margin-bottom: 0.8rem;
}

.riddle { font-size: 1.22rem; font-style: italic; line-height: 1.65; }
.riddle em { font-style: normal; font-weight: 700; }
</style>
</head>
<body>
<svg class="thread" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <!-- thread from behind the note down to the X on the map -->
  <path d="M50,52 C46,68 38,74 33,82" fill="none" stroke="#8c2b1a"
        stroke-width="0.45" stroke-dasharray="1.6 1.2" opacity="0.75"
        vector-effect="non-scaling-stroke"/>
</svg>
<svg class="thread" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true"
     style="display:none"></svg>
<div class="xmark" style="position:fixed; left:33%; top:82%; transform:translate(-50%,-50%) rotate(-6deg);
     font-family:'Pirata One',cursive; font-size:3rem; color:#8c2b1a; opacity:0.85;
     text-shadow:0 1px 0 rgba(255,245,220,0.4);">&#10008;</div>
<div class="scene">
  <main class="note">
    <div class="pin"><span>I</span></div>
    <div class="eyebrow">Brandon&rsquo;s Treasure Hunt &mdash; Stop I</div>
    <h1>The Voyage Begins</h1>
    <p class="riddle">I'm a <em>quiet</em> Italian, ticklish, and not your boyfriend.</p>
  </main>
</div>
</body>
</html>
