<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <g fill="none" stroke="#5c4a2c" stroke-linecap="round">
    <!-- chart grid -->
    <g opacity="0.06" stroke-width="2">
      <path d="M200,0V1200 M400,0V1200 M600,0V1200 M800,0V1200 M1000,0V1200 M1200,0V1200 M1400,0V1200"/>
      <path d="M0,200H1600 M0,400H1600 M0,600H1600 M0,800H1600 M0,1000H1600"/>
    </g>
    <!-- islands -->
    <g opacity="0.16" stroke-width="4">
      <path d="M180,260 C140,180 260,120 340,150 C430,180 460,260 400,320 C340,380 220,340 180,260 Z"/>
      <path d="M1150,400 C1100,300 1250,240 1350,280 C1450,320 1480,440 1380,500 C1280,560 1200,500 1150,400 Z"/>
      <path d="M600,900 C550,820 680,760 780,790 C880,820 900,920 800,970 C700,1020 650,980 600,900 Z"/>
    </g>
    <!-- island hatching -->
    <g opacity="0.09" stroke-width="3">
      <path d="M230,300 l30,20 M280,320 l30,15 M1200,470 l35,20 M1270,500 l35,15 M660,940 l35,18 M730,965 l30,15"/>
    </g>
    <!-- mountains and palm marks -->
    <g opacity="0.14" stroke-width="4">
      <path d="M270,230 l25,-40 25,40 M310,240 l25,-40 25,40"/>
      <path d="M1280,360 q5,-45 10,-55 q-25,10 -35,-5 q20,0 35,5 q15,-15 40,-12 q-25,5 -40,12"/>
      <path d="M720,860 l20,-35 20,35"/>
    </g>
    <!-- sea waves -->
    <g opacity="0.08" stroke-width="3">
      <path d="M880,180 q20,-15 40,0 q20,15 40,0"/>
      <path d="M300,620 q20,-15 40,0 q20,15 40,0"/>
      <path d="M1100,900 q20,-15 40,0 q20,15 40,0"/>
      <path d="M550,380 q20,-15 40,0 q20,15 40,0"/>
      <path d="M1350,700 q20,-15 40,0 q20,15 40,0"/>
    </g>
    <!-- dotted route -->
    <path d="M120,1080 C300,900 250,700 420,620 C600,530 700,700 900,640 C1100,580 1150,460 1300,420"
          opacity="0.22" stroke-width="6" stroke-dasharray="1 22"/>
    <!-- X marks the spot -->
    <g opacity="0.3" stroke-width="10">
      <path d="M1280,400 L1320,440 M1320,400 L1280,440"/>
    </g>
    <!-- sea serpent -->
    <g opacity="0.12" stroke-width="4">
      <path d="M950,1020 q25,-35 50,0 q25,35 50,0 q25,-35 50,0 M1100,1020 q15,-25 30,-15 l-12,18"/>
    </g>
  </g>
</svg>
