<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clue QR codes — print me</title>
<style>
  body { font-family: sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 2rem; }
  figure { text-align: center; page-break-inside: avoid; }
  img { width: 220px; height: 220px; image-rendering: pixelated; }
  figcaption { font-size: 1.1rem; margin-top: 0.5rem; }
</style>
</head>
<body>
<p>Cut these out. The label is for YOU (where to hide it) — cut it off before hiding.</p>
<div class="grid">
  <figure><img src="clue1.png" alt=""><figcaption>Clue 1 — hand to him / trail head</figcaption></figure>
  <figure><img src="clue2.png" alt=""><figcaption>Clue 2 — hide at spot #2</figcaption></figure>
  <figure><img src="clue3.png" alt=""><figcaption>Clue 3 — hide at spot #3</figcaption></figure>
  <figure><img src="clue4.png" alt=""><figcaption>Clue 4 — hide at spot #4</figcaption></figure>
  <figure><img src="clue5.png" alt=""><figcaption>Clue 5 — hide at spot #5</figcaption></figure>
  <figure><img src="treasure.png" alt=""><figcaption>Treasure — hide at final spot</figcaption></figure>
</div>
</body>
</html>
